<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>TSUE Platform | Kirish</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0f2a 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255,255,255,0.98);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #1E2A5E, #D4AF37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: #f0f2f5;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
        }
        .tab.active {
            background: #1E2A5E;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 28px;
            font-size: 1rem;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1E2A5E, #2a3a7a);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #15204a, #1E2A5E);
        }
        .msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 28px;
            text-align: center;
            display: none;
        }
        .msg.error {
            background: #fee2e2;
            color: #b91c1c;
            display: block;
        }
        .msg.success {
            background: #e0f2fe;
            color: #0f3b5c;
            display: block;
        }
        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 TSUE <span style="color:#D4AF37;">CAREER</span></h1>
    <div class="tabs">
        <button class="tab active" data-tab="register">📝 Ro'yxatdan o'tish</button>
        <button class="tab" data-tab="login">🔐 Profilga kirish</button>
    </div>

    <div id="register" class="form active">
        <input type="text" id="regName" placeholder="Ism">
        <input type="text" id="regSurname" placeholder="Familiya">
        <input type="password" id="regPassword" placeholder="Parol">
        <button onclick="register()">📌 Ro'yxatdan o'tish</button>
    </div>

    <div id="login" class="form">
        <input type="text" id="loginName" placeholder="Ism">
        <input type="text" id="loginSurname" placeholder="Familiya">
        <input type="password" id="loginPassword" placeholder="Parol">
        <button onclick="login()">🚀 Kirish</button>
    </div>

    <div id="message" class="msg"></div>
    <footer>© TSUE Programming Career — bilim sari bir qadam</footer>
</div>

<script>
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        });
    });

    function showMsg(text, isError) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = 'msg ' + (isError ? 'error' : 'success');
        setTimeout(() => msg.className = 'msg', 3000);
    }

    async function register() {
        const name = document.getElementById('regName').value.trim();
        const surname = document.getElementById('regSurname').value.trim();
        const password = document.getElementById('regPassword').value;
        if (!name || !surname || !password) return showMsg('Hamma maydonni to\'ldiring', true);
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, surname, password })
        });
        const data = await res.json();
        if (data.success) {
            showMsg("✅ Ro'yxatdan o'tdingiz! Endi kiring.", false);
            document.querySelector('.tab[data-tab="login"]').click();
        } else showMsg(data.error, true);
    }

    async function login() {
        const name = document.getElementById('loginName').value.trim();
        const surname = document.getElementById('loginSurname').value.trim();
        const password = document.getElementById('loginPassword').value;
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, surname, password })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('userId', data.user.id);
            localStorage.setItem('userName', `${data.user.name} ${data.user.surname}`);
            window.location.href = '/dashboard.html';
        } else showMsg(data.error, true);
    }
</script>
</body>
</html>
